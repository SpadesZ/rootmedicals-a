<div class="search-header">
    <div class="search-logo-container">
        <!-- 系統標題更替 -->

    <div class="search-box-container">

                    <div class="section-label">Go To</div>

                </div>
                <div class="dropdown-section">
                    <div class="section-label">Search For</div>
                    <ul id="searchfor-list" class="suggestion-list"></ul>

            </div>
