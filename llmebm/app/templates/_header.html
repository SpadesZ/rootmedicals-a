<!--
  模組定位: llmebm 首頁、Topic 與 Admin 共用頂部導覽及 About 對話框。
  主要責任: 呈現品牌、管理入口、字級控制與產品用途說明。
  呼叫來源: index.html、specialty.html 與 admin.html 的 Jinja include。
  輸入契約: _brand.html、app.js 與 style.css 提供的既有共用介面。
  輸出契約: About 必須是可鍵盤操作的按鈕，並開啟具名稱的原生 modal dialog。
  安全邊界: 僅呈現自有靜態產品說明；不載入外部內容、不執行管理操作。
  維護提醒: 變更共用控制時須同步驗證 Home、Topic、Admin 與窄 viewport。
  ----------------------------------------------------------------------------------------------------
-->
<header class="top-bar">
    
    <!-- 導覽列左側：品牌與計算機入口 -->
    <div class="top-bar-left" style="display: flex; align-items: center;">
        
        <!-- 動態引入切割出來的品牌區塊，已具備首頁跳轉功能 -->
        {% include '_brand.html' %}
        
        <span class="top-link">Calculators</span>
    
    </div>
    
    <!-- 導覽列右側：關於、管理員與全域設定 -->
    <div class="top-bar-right" style="display: flex; align-items: center;">
        
        <button
            id="btn-about"
            class="top-link top-link-button"
            type="button"
            aria-haspopup="dialog"
            aria-controls="about-dialog"
            aria-expanded="false"
        >
            &#8505; About
        </button>
        
        <!-- 系統管理員入口 (Admin) -->
        <a 
            href="/admin" 
            class="top-link admin-link" 
            title="System Settings" 
            style="color: white; text-decoration: none; margin-left: 20px; font-weight: bold;"
        >
            &#9881; Admin
        </a>

        <!-- 視覺分隔線 -->
        <div style="height: 20px; width: 1px; background-color: rgba(255,255,255,0.3); margin: 0 20px;"></div>
        
        <!-- 字體縮放控制區塊 (A-/A/A+) 移至最右側 -->
        <div class="font-control-group">
            <button id="btn-font-decrease" class="font-btn" title="縮小字體">A-</button>
            <button id="btn-font-reset" class="font-btn" title="重設字體">A</button>
            <button id="btn-font-increase" class="font-btn" title="放大字體">A+</button>
        </div>

    </div>
</header>

<dialog id="about-dialog" class="about-dialog" aria-labelledby="about-dialog-title">
    <div class="about-dialog-header">
        <h2 id="about-dialog-title">RootMedicals EBM-Dx</h2>
        <button id="btn-about-close" class="about-dialog-close" type="button" aria-label="Close About">&times;</button>
    </div>
    <p>Evidence-backed dynamic topic workspace.</p>
    <p>Generated sections require citations from the local evidence index.</p>
    <p>Draft content must complete clinical review before publication.</p>
    <p class="about-dialog-build">Current build: local development / demo preview.</p>
</dialog>
