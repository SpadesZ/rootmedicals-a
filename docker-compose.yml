version: '3.8'

services:
  llmxx-server:
    build: ./llmxx-server
    ports:
      - "8000:8000"
    volumes:
      - ./shared_data:/shared_data
      - ./llmxx-server/data:/app/data
    env_file:
      - .env

  llmebm:
    build: ./llmebm
    ports:
      - "8001:8000"
    volumes:
      - ./shared_data:/shared_data
      - ./llmebm/data:/app/data
    env_file:
      - .env
      - .env.topic
    environment:
      - EBM_RAG_BASE_URL=${EBM_RAG_BASE_URL:-http://host.docker.internal:33301}

  roothinx:
    build: ./roothinx
    ports:
      - "8002:8000"
    volumes:
      - ./shared_data:/shared_data
      - ./roothinx/data:/app/data
    env_file:
      - .env
