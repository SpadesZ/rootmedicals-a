<!--
File Path: ebm-rag/docs/rag_backend_llm_flow_ppt.svg
Timestamp: 2026-06-12
Version: v0.3
Description: One-page PPT-ready RootMedicals EBM-RAG backend and LLM responsibility flow diagram.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RootMedicals EBM-RAG Flow</title>
  <desc id="desc">A one-page flow diagram showing the medical question, evidence retrieval, LLM summary, source validation, safety light, doctor-facing output, and LLM responsibilities.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowBlue" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto">
      <path d="M2,2 L14,8 L2,14 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowTeal" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto">
      <path d="M2,2 L14,8 L2,14 Z" fill="#047481"/>
    </marker>
    <style>
      .bg { fill: #f6fafb; }
      .title { font: 800 44px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #083344; letter-spacing: 0; }
      .subtitle { font: 500 20px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .lane-label { font: 800 20px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .step-no { font: 800 18px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .step-title { font: 800 24px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .step-body { font: 500 17px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .small { font: 500 15px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .panel-title { font: 800 26px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .panel-body { font: 600 18px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #334155; letter-spacing: 0; }
      .footer { font: 700 19px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #164e63; letter-spacing: 0; }
      .model-title { font: 800 15px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #92400e; letter-spacing: 0; }
      .model-body { font: 700 13px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #78350f; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #d9e3ea; stroke-width: 1.5; filter: url(#shadow); }
      .model-tag { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.4; filter: url(#shadow); }
      .prep-card { fill: #eefdf7; stroke: #99f6e4; stroke-width: 1.5; }
      .llm-panel { fill: #fff8e7; stroke: #fbbf24; stroke-width: 1.5; filter: url(#shadow); }
      .safe-card { fill: #fff1f2; stroke: #fda4af; stroke-width: 1.5; }
      .output-card { fill: #eef6ff; stroke: #93c5fd; stroke-width: 1.5; }
      .chip { fill: #0f766e; }
      .chip-blue { fill: #2563eb; }
      .chip-amber { fill: #d97706; }
      .chip-rose { fill: #e11d48; }
      .line-blue { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrowBlue); }
      .line-teal { stroke: #047481; stroke-width: 4; fill: none; marker-end: url(#arrowTeal); }
      .dashed { stroke-dasharray: 10 10; }
      .pill-green { fill: #dcfce7; stroke: #22c55e; }
      .pill-yellow { fill: #fef3c7; stroke: #f59e0b; }
      .pill-orange { fill: #ffedd5; stroke: #f97316; }
      .pill-text { font: 800 16px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <text x="70" y="76" class="title">RootMedicals EBM-RAG：從醫生問題到安全輸出</text>
  <text x="72" y="112" class="subtitle">後端掌控證據、來源與安全；LLM 負責把已取回證據整理成可讀回答</text>

  <rect x="62" y="150" width="1476" height="530" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="92" y="193" class="lane-label">即時回答流程</text>

  <g transform="translate(252 168)">
    <rect class="model-tag" x="0" y="0" width="245" height="54" rx="14"/>
    <text class="model-title" x="16" y="23">query_decompose</text>
    <text class="model-body" x="16" y="43">可選任務：查詢擴寫</text>
  </g>

  <g transform="translate(428 408)">
    <rect class="model-tag" x="0" y="0" width="250" height="54" rx="14"/>
    <text class="model-title" x="16" y="23">embedding_dense</text>
    <text class="model-body" x="16" y="43">文字轉向量，協助找證據</text>
  </g>

  <g transform="translate(645 168)">
    <rect class="model-tag" x="0" y="0" width="255" height="54" rx="14"/>
    <text class="model-title" x="16" y="23">ebm_generate</text>
    <text class="model-body" x="16" y="43">主任務：EBM 摘要生成</text>
  </g>

  <g transform="translate(1032 408)">
    <rect class="model-tag" x="0" y="0" width="270" height="54" rx="14"/>
    <text class="model-title" x="16" y="23">claim_verify</text>
    <text class="model-body" x="16" y="43">Demo 任務：claim 支持度檢查</text>
  </g>

  <g transform="translate(90 230)">
    <rect class="card" x="0" y="0" width="205" height="170" rx="20"/>
    <circle class="chip-blue" cx="32" cy="34" r="20"/>
    <text class="step-no" x="26" y="41">1</text>
    <text class="step-title" x="25" y="80">醫生輸入問題</text>
    <text class="step-body" x="25" y="112">症狀、診斷、治療</text>
    <text class="step-body" x="25" y="140">或 guideline 查詢</text>
  </g>

  <path class="line-blue" d="M 305 315 C 335 315 350 315 380 315"/>

  <g transform="translate(380 230)">
    <rect class="card" x="0" y="0" width="205" height="170" rx="20"/>
    <circle class="chip" cx="32" cy="34" r="20"/>
    <text class="step-no" x="26" y="41">2</text>
    <text class="step-title" x="25" y="80">系統找證據</text>
    <text class="step-body" x="25" y="112">搜尋已審核醫學片段</text>
    <text class="step-body" x="25" y="140">保留來源與等級</text>
  </g>

  <path class="line-blue" d="M 585 315 C 615 315 630 315 660 315"/>

  <g transform="translate(660 230)">
    <rect class="card" x="0" y="0" width="205" height="170" rx="20"/>
    <circle class="chip-amber" cx="32" cy="34" r="20"/>
    <text class="step-no" x="26" y="41">3</text>
    <text class="step-title" x="25" y="80">LLM 整理回答</text>
    <text class="step-body" x="25" y="112">濃縮證據重點</text>
    <text class="step-body" x="25" y="140">生成醫生可讀摘要</text>
  </g>

  <path class="line-blue" d="M 865 315 C 895 315 910 315 940 315"/>

  <g transform="translate(940 230)">
    <rect class="card" x="0" y="0" width="205" height="170" rx="20"/>
    <circle class="chip-blue" cx="32" cy="34" r="20"/>
    <text class="step-no" x="26" y="41">4</text>
    <text class="step-title" x="25" y="80">系統核對來源</text>
    <text class="step-body" x="25" y="112">檢查引用 chunk</text>
    <text class="step-body" x="25" y="140">驗證格式與追溯性</text>
  </g>

  <path class="line-blue" d="M 1145 315 C 1175 315 1190 315 1220 315"/>

  <g transform="translate(1220 230)">
    <rect class="safe-card" x="0" y="0" width="205" height="170" rx="20"/>
    <circle class="chip-rose" cx="32" cy="34" r="20"/>
    <text class="step-no" x="26" y="41">5</text>
    <text class="step-title" x="25" y="80">安全燈號</text>
    <rect class="pill-green" x="25" y="100" width="54" height="28" rx="14"/>
    <text class="pill-text" x="38" y="120">綠</text>
    <rect class="pill-yellow" x="86" y="100" width="54" height="28" rx="14"/>
    <text class="pill-text" x="99" y="120">黃</text>
    <rect class="pill-orange" x="147" y="100" width="54" height="28" rx="14"/>
    <text class="pill-text" x="160" y="120">橘</text>
    <text class="step-body" x="25" y="152">依證據與風險判斷</text>
  </g>

  <path class="line-blue" d="M 1322 400 C 1322 438 1322 450 1322 488"/>

  <g transform="translate(1195 488)">
    <rect class="output-card" x="0" y="0" width="255" height="130" rx="20"/>
    <circle class="chip-blue" cx="32" cy="34" r="20"/>
    <text class="step-no" x="26" y="41">6</text>
    <text class="step-title" x="25" y="75">輸出給醫生</text>
    <text class="step-body" x="25" y="105">摘要 + 證據等級 + 來源</text>
  </g>

  <g transform="translate(90 475)">
    <text x="0" y="0" class="lane-label">事前資料準備</text>
    <rect class="prep-card" x="0" y="28" width="230" height="112" rx="18"/>
    <text class="step-title" x="24" y="72">醫學文獻入庫</text>
    <text class="step-body" x="24" y="103">PDF、指南、論文</text>

    <path class="line-teal" d="M 240 84 C 268 84 286 84 314 84"/>

    <rect class="prep-card" x="315" y="28" width="230" height="112" rx="18"/>
    <text class="step-title" x="339" y="72">切成證據片段</text>
    <text class="step-body" x="339" y="103">附來源、等級、metadata</text>

    <path class="line-teal" d="M 555 84 C 583 84 601 84 629 84"/>

    <rect class="prep-card" x="630" y="28" width="230" height="112" rx="18"/>
    <text class="step-title" x="654" y="72">建立向量索引</text>
    <text class="step-body" x="654" y="103">讓系統快速找證據</text>

    <path class="line-teal dashed" d="M 860 84 C 945 84 1015 18 1085 -118"/>
  </g>

  <rect class="llm-panel" x="88" y="710" width="650" height="128" rx="24"/>
  <text x="118" y="752" class="panel-title">LLM 職責</text>
  <text x="118" y="787" class="panel-body">query_decompose：查詢擴寫；ebm_generate：證據摘要</text>
  <text x="118" y="818" class="panel-body">embedding_dense：文字轉向量；claim_verify：Demo claim 檢查</text>

  <rect x="778" y="710" width="760" height="128" rx="24" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="808" y="752" class="panel-title">後端職責</text>
  <text x="808" y="790" class="panel-body">資料入庫、檢索排序、來源驗證、安全燈號、Retrieval Log</text>
  <text x="808" y="820" class="small">最終輸出由後端規則把關，保留 query_id 供追蹤與稽核</text>

  <text x="72" y="872" class="footer">一句話：後端負責證據與安全，LLM 負責把證據整理成醫生看得懂的回答。</text>
</svg>
