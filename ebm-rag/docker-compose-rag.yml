# File Path: ebm-rag/docker-compose-rag.yml
# Timestamp: 2026-06-09
# Version: v0.6
# Description: EBM-RAG Docker Compose stack.
#              Runs FastAPI on host port 33301 and Qdrant on 6333/6334 with persistent local data volumes.
# ----------------------------------------------------------------------------------------------------
services:
  ebm-rag-engine:
    build: 
      context: .
      dockerfile: Dockerfile.rag
    container_name: ebm_rag_web_ui
    command: uvicorn main_rag:app --host 0.0.0.0 --port 8000
    ports:
      - "33301:8000"
    volumes:
      - ./rag_core:/app/rag_core
      - ./lava:/app/lava
      - ./app:/app/app
      - ./main_rag.py:/app/main_rag.py
      - ./data:/app/data
    environment:
      - ENV=development
      - PYTHONUNBUFFERED=1
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
      - QDRANT_URL=http://qdrant:6333
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/rag/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - rag_internal_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ebm_rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant/storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -ec ': >/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - rag_internal_net

networks:
  rag_internal_net:
    driver: bridge
