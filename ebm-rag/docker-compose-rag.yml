# 模組定位: EBM-RAG FastAPI 與 Qdrant 的本機/交付 compose runtime。
# 主要責任: 建置服務、掛載持久資料、注入非硬編碼設定並提供健康檢查。
# 呼叫來源: 開發者、RootMedicals 控制流程與交付環境的 docker compose。
# 輸入契約: 根目錄 .env/.env.topic、ebm-rag source/data 與可用 Docker engine。
# 輸出契約: host 33301 的 RAG API、6333/6334 的 Qdrant，以及可判定的 container health。
# 安全邊界: secrets 只從未追蹤 env file 注入；健康檢查不得繞過 readiness/quality gate。
# 維護提醒: corpus/readiness 成本變化時量測 health latency；若持續成長，分離或快取 readiness。
# ----------------------------------------------------------------------------------------------------
services:
  ebm-rag-engine:
    build: 
      context: .
      dockerfile: Dockerfile.rag
    container_name: ebm_rag_web_ui
    command: uvicorn main_rag:app --host 0.0.0.0 --port 8000
    ports:
      - "33301:8000"
    volumes:
      - ./rag_core:/app/rag_core
      - ./lava:/app/lava
      - ./app:/app/app
      - ./main_rag.py:/app/main_rag.py
      - ./data:/app/data
    # Keep the cross-service generation token identical to llmebm when this
    # module compose file is started directly from ebm-rag/.
    env_file:
      - ../.env
      - ../.env.topic
    environment:
      - ENV=development
      - PYTHONUNBUFFERED=1
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
      - QDRANT_URL=http://qdrant:6333
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    # ponytail: /health includes an O(indexed chunks) quality gate; keep timeout headroom until readiness is cached/separated.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/rag/health', timeout=12)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s
    networks:
      - rag_internal_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ebm_rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant/storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -ec ': >/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - rag_internal_net

networks:
  rag_internal_net:
    driver: bridge
